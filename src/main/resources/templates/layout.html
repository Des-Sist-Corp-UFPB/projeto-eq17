<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo != null ? titulo + ' — HomeHub' : 'HomeHub'}">HomeHub</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS via WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>

    <!-- Umami Analytics -->
    <script defer src="https://umami.dsc.rodrigor.com/script.js" data-website-id="d47e0ad7-c026-4d14-a2fb-2ba04c79e6dc"></script>

    <style>
        :root {
            --primary-color: #1a237e; /* Azul Escuro Premium */
            --primary-dark: #0d1b2a;
            --accent-color: #3949ab;
            --bg-color: #f8fafc;
            --card-shadow: 0 10px 25px -5px rgba(26, 35, 126, 0.06), 0 8px 10px -6px rgba(26, 35, 126, 0.04);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #0f172a;
        }

        /* Navbar elegante */
        .navbar {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .navbar-brand {
            font-weight: 800;
            color: var(--primary-color) !important;
            display: flex;
            align-items: center;
            letter-spacing: -0.8px;
            font-size: 1.35rem;
        }
        .navbar-brand svg {
            color: var(--primary-color);
            fill: url(#brandGradient);
        }
        .nav-link {
            color: #475569 !important;
            font-weight: 500;
            padding: 0.5rem 1.1rem !important;
            border-radius: 8px;
            transition: var(--transition-smooth);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary-color) !important;
            background-color: #e0e7ff;
        }
        .dropdown-menu {
            border: 1px solid #e5e7eb;
            box-shadow: var(--card-shadow);
            border-radius: 8px;
        }

        /* Estilos de Botão */
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            transition: var(--transition-smooth);
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--primary-dark) !important;
            border-color: var(--primary-dark) !important;
            transform: translateY(-1px);
        }
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
        }
        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Cards modernos */
        .card {
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        /* Indicador de carregamento HTMX */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }

        /* Tabs customizadas */
        .nav-tabs {
            border-bottom: 2px solid #e5e7eb;
        }
        .nav-tabs .nav-link {
            border: none !important;
            border-bottom: 2px solid transparent !important;
            border-radius: 0 !important;
            font-weight: 600;
            color: #6b7280 !important;
        }
        .nav-tabs .nav-link:hover {
            background-color: transparent;
            color: #374151 !important;
        }
        .nav-tabs .nav-link.active {
            border-bottom-color: var(--primary-color) !important;
            color: var(--primary-color) !important;
            background-color: transparent !important;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light mb-4 py-3">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" 
                 class="bi bi-houses-fill me-2" viewBox="0 0 16 16">
                <defs>
                    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#3949ab;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M7.207 1a1 1 0 0 0-1.414 0L.146 5.646a.5.5 0 0 0 .708.708L1 5.829V13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5V5.83l.146.124a.5.5 0 0 0 .708-.708L11.793 1zM2 4.77l4-3.333 4 3.333v8.73h-8V4.77z"/>
            </svg>
            HomeHub
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/dashboard')} ? 'active'" th:href="@{/dashboard}">
                        Minhas Repúblicas
                    </a>
                </li>
            </ul>

            <!-- Usuário logado -->
            <ul class="navbar-nav">
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" data-bs-toggle="dropdown">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" 
                             class="bi bi-person-circle me-2" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                        </svg>
                        <span sec:authentication="name" style="font-weight: 600;">Usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger d-flex align-items-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" 
                                         class="bi bi-box-arrow-right me-2" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2a1.5 1.5 0 0 0-1.5-1.5h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                                        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                                    </svg>
                                    Sair da Conta
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<main class="container">
    <th:block th:replace="${content}">
    </th:block>
</main>

<!-- RODAPÉ -->
<footer class="text-center py-4 mt-5 text-muted border-top bg-white">
    <div class="container">
        <p class="mb-0 small">
            © 2026 HomeHub — Plataforma de Gestão de Repúblicas e Moradias Compartilhadas.
        </p>
    </div>
</footer>

<!-- SCRIPTS -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>

<!-- Container para modais HTMX -->
<div id="modal-container"></div>

<script>
    // Configura a ativação automática dos modais carregados via HTMX
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'modal-container') {
            const modalEl = document.querySelector('.modal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        }
    });
</script>

</body>
</html>
