<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — HomeHub</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <!-- Umami Analytics -->
    <script defer src="https://umami.dsc.rodrigor.com/script.js" data-website-id="d47e0ad7-c026-4d14-a2fb-2ba04c79e6dc"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1a237e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }

        .brand-logo {
            color: #1a237e;
            font-weight: 800;
            font-size: 1.85rem;
            letter-spacing: -0.8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background-color: #1a237e;
            border-color: #1a237e;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0d1b2a !important;
            border-color: #0d1b2a !important;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.15);
        }

        .register-link {
            color: #1a237e;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" 
             class="bi bi-houses-fill me-2" viewBox="0 0 16 16">
            <path d="M7.207 1a1 1 0 0 0-1.414 0L.146 5.646a.5.5 0 0 0 .708.708L1 5.829V13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5V5.83l.146.124a.5.5 0 0 0 .708-.708L11.793 1zM2 4.77l4-3.333 4 3.333v8.73h-8V4.77z"/>
        </svg>
        HomeHub
    </div>

    <h4 class="text-center mb-4 fw-bold text-dark">Entrar na sua conta</h4>

    <!-- Alertas -->
    <div class="alert alert-danger py-2 small" role="alert" th:if="${param.error}">
        E-mail ou senha inválidos. Tente novamente.
    </div>

    <div class="alert alert-success py-2 small" role="alert" th:if="${param.logout}">
        Você saiu da conta com sucesso.
    </div>

    <div class="alert alert-success py-2 small" role="alert" th:if="${param.cadastroSucesso}">
        Conta criada com sucesso! Faça login abaixo.
    </div>

    <!-- Formulário -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">E-mail</label>
            <input type="email" class="form-control" id="username" name="username" 
                   placeholder="exemplo@email.com" required autofocus/>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label small fw-semibold text-secondary mb-0">Senha</label>
                <a th:href="@{/esqueceu-senha}" class="register-link small">Esqueceu sua senha?</a>
            </div>
            <input type="password" class="form-control" id="password" name="password" 
                   placeholder="Digite sua senha" required/>
        </div>


        <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
    </form>

    <div class="text-center mt-3 small text-muted">
        Ainda não tem conta? <a th:href="@{/cadastro}" class="register-link">Cadastre-se</a>
    </div>
</div>

</body>
</html>
