<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main})}">
<body>

<main>
    <div class="row align-items-center mb-5">
        <div class="col-md-8">
            <h2 class="fw-bold text-dark mb-1">
                Olá, <span th:text="${usuarioLogado.nome}">Usuário</span>!
            </h2>
            <p class="text-secondary mb-0">
                Seja bem-vindo ao painel das suas repúblicas compartilhadas.
            </p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <!-- Botão que abre o modal de criar casa -->
            <button class="btn btn-primary d-inline-flex align-items-center" 
                    data-bs-toggle="modal" data-bs-target="#criarCasaModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" 
                     class="bi bi-house-add-fill me-2" viewBox="0 0 16 16">
                    <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0m-7.01-8.793a1 1 0 0 0-1.414 0L.146 6.854A.5.5 0 0 0 .5 7.707h1v5.793A1.5 1.5 0 0 0 3 15h4a.5.5 0 0 0 0-1H3a.5.5 0 0 1-.5-.5V7.707h8.793c.096 0 .19-.016.279-.047l.487.413a.5.5 0 0 0 .64-.768L12.5 6.854l-.146-.124a.5.5 0 0 0-.708 0L8.5 9.707l-3.01-2.906z"/>
                    <path d="M11.5 4.875a.5.5 0 0 0-1 0v1.586L8.707 4.646a.5.5 0 0 0-.708 0L5 7.646V4.875a.5.5 0 0 0-1 0v3.586L2.146 6.646a.5.5 0 0 0-.708.708l3.5 3.5a.5.5 0 0 0 .708 0l3.5-3.5a.5.5 0 0 0-.708-.708L6 9.293V4.875z"/>
                </svg>
                Criar República
            </button>
        </div>
    </div>

    <!-- Feedback de Erro de Criação -->
    <div class="alert alert-danger" th:if="${param.erro}">
        Ocorreu um erro: <span th:text="${param.erro}">Erro</span>
    </div>

    <!-- Lista de Casas -->
    <div th:if="${casas.isEmpty()}" class="text-center py-5 bg-white rounded-3 border">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" 
             class="bi bi-house-exclamation text-muted mb-3" viewBox="0 0 16 16">
            <path d="M7.293 1.5a1 1 0 0 1 1.414 0l6.647 6.646a.5.5 0 0 1-.708.708L8 2.207 1.354 8.854a.5.5 0 1 1-.708-.708z"/>
            <path d="M2 9.5V14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9.5l-5-4.5z"/>
            <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 7.275c.007-.48.393-.88.882-.88.484 0 .873.4.882.88l.056 2.4c.007.294-.239.536-.534.536H7.576c-.295 0-.54-.242-.534-.536z"/>
        </svg>
        <h4 class="fw-semibold text-secondary">Nenhuma república encontrada</h4>
        <p class="text-muted small">Você ainda não participa de nenhuma república compartilhadada.</p>
        <button class="btn btn-primary btn-sm mt-2" data-bs-toggle="modal" data-bs-target="#criarCasaModal">
            Criar minha primeira
        </button>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${casas.isEmpty()}">
        <div class="col" th:each="casa : ${casas}">
            <div class="card h-100 p-3 bg-white">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex align-items-center mb-3">
                        <div class="p-2 bg-light text-primary rounded-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" 
                                 class="bi bi-house" viewBox="0 0 16 16">
                                <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                            </svg>
                        </div>
                        <div>
                            <h5 class="card-title fw-bold text-dark mb-0" th:text="${casa.nome}">Nome da República</h5>
                            <span class="badge bg-secondary-subtle text-secondary small" th:text="${casa.moradores.size()} + ' morador(es)'">
                                0 moradores
                            </span>
                        </div>
                    </div>
                    
                    <p class="card-text text-muted small mb-4 flex-grow-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" 
                             class="bi bi-geo-alt me-1" viewBox="0 0 16 16">
                            <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
                        </svg>
                        <span th:text="${casa.endereco}">Endereço completo da residência</span>
                    </p>

                    <a th:href="@{/casas/{id}(id=${casa.id})}" class="btn btn-outline-primary w-100 mt-auto d-flex align-items-center justify-content-center">
                        Gerenciar República
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" 
                             class="bi bi-arrow-right-short ms-1" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M4 8a.5.5 0 0 1 .5-.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5A.5.5 0 0 1 4 8"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CRIAR CASA -->
    <div class="modal fade" id="criarCasaModal" tabindex="-1" aria-labelledby="criarCasaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content shadow rounded-3 border-0">
                <form th:action="@{/casas}" th:object="${casaForm}" method="post">
                    <div class="modal-header border-bottom-0 pt-4 px-4">
                        <h5 class="modal-title fw-bold text-dark" id="criarCasaModalLabel">Criar nova República</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body px-4">
                        <div class="mb-3">
                            <label for="nome" class="form-label small fw-semibold text-secondary">Nome da República</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" 
                                   placeholder="Ex: República dos Maníacos" required/>
                        </div>
                        <div class="mb-3">
                            <label for="endereco" class="form-label small fw-semibold text-secondary">Endereço da Casa</label>
                            <textarea class="form-control" id="endereco" th:field="*{endereco}" rows="3" 
                                      placeholder="Rua, Número, Bairro, Cidade..." required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pb-4 px-4">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar e Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

</body>
</html>
