spring:
  main:
    allow-bean-definition-overriding: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}

    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  application:
    name: republicas
  profiles:
    active: dev
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - email
              - profile
        provider:
          google:
            user-name-attribute: email
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:default-key-please-change}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o-mini}

    mcp:
      server:
        name: republica-mcp
        version: 1.0.0
        protocol: STREAMABLE


# Actuator - monitoramento da aplicação
# Acesse: http://localhost:8080/actuator/health
management:
  endpoints:
    web:
      exposure:
        # Expõe apenas os endpoints necessários (não exponha todos em produção!)
        include: health,info,metrics
  endpoint:
    health:
      # Detalhes do health só são exibidos para usuários autenticados
      show-details: when-authorized

server:
  forward-headers-strategy: native

app:
  url: ${APP_URL:https://eq17.dsc.rodrigor.com}

