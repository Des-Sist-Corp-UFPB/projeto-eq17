# =============================================================================
# Docker Compose — PRODUÇÃO
# =============================================================================
#
# Em produção, a imagem Docker é construída pelo GitHub Actions e publicada
# no GHCR (GitHub Container Registry). Este arquivo usa a imagem pré-construída
# em vez de buildar no servidor.
#
# CONFIGURAÇÃO — arquivo .env no diretório /home/ghactions/projeto-eq17/ no servidor:
#
#   APP_IMAGE=ghcr.io/des-sist-corp-ufpb/projeto-eq17:latest
#   DATABASE_URL=jdbc:postgresql://postgres:5432/eq17
#   DATABASE_USERNAME=postgres
#   DATABASE_PASSWORD=<senha-do-banco>
#   CONTAINER_NAME=eq17-app
#   HOST_PORT=8017
#   APP_DOMAIN=eq17.dsc.rodrigor.com
#   DOCKER_NETWORK=caddy
#
# ATUALIZAÇÕES (feitas automaticamente pelo GitHub Actions):
#   docker compose -f docker/docker-compose.prod.yml up -d --no-deps --force-recreate app
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Aplicação Spring Boot
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}
    container_name: ${CONTAINER_NAME:-eq17-app}
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/eq17}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      # Expõe a porta de forma configurável para evitar colisões
      - "${HOST_PORT:-8017}:8080"
    
    # Integração automática com Caddy (Caddy Docker Proxy)
    labels:
      caddy: ${APP_DOMAIN:-eq17.dsc.rodrigor.com}
      caddy.reverse_proxy: "{{upstreams 8080}}"

    # Healthcheck via Spring Actuator — o Docker considera o container saudável
    # somente quando a aplicação estiver pronta para receber requisições.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    # Spring Boot precisa de até 60s para inicializar
    restart: unless-stopped
    networks:
      - caddy

networks:
  # Rede docker externa por onde o Caddy se comunica com os containers das equipes
  caddy:
    name: ${DOCKER_NETWORK:-caddy}
    external: true
