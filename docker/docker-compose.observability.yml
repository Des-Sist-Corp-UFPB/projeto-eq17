version: "3.8"

services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.6.0
    container_name: otel-lgtm
    ports:
      - "3000:3000"   # Grafana (interface web)
      - "4317:4317"   # OTLP via gRPC
      - "4318:4318"   # OTLP via HTTP
    networks:
      - republicas-net

networks:
  republicas-net:
    name: docker_republicas-net
    external: true
