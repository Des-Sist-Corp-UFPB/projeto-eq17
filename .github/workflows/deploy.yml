name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Iniciar daemon do Docker (para runner self-hosted)
        run: |
          echo "Limpando possíveis processos e arquivos do Docker antigos..."
          sudo service docker stop || true
          sudo pkill -9 -f dockerd || true
          sudo pkill -9 -f docker-proxy || true
          sudo pkill -9 -f containerd || true
          sudo rm -f /var/run/docker.pid
          sudo rm -f /var/run/docker.sock
          sudo rm -rf /var/run/containerd/* || true
          
          echo "Tentando iniciar o daemon do Docker..."
          # Inicia dockerd em segundo plano direcionando logs para arquivo
          sudo dockerd > /tmp/dockerd.log 2>&1 &
          
          echo "Aguardando o Docker inicializar..."
          DOCKER_OK=false
          for i in {1..15}; do
            if docker ps >/dev/null 2>&1; then
              echo "✓ Docker daemon está pronto!"
              DOCKER_OK=true
              break
            fi
            echo "Aguardando daemon... ($i/15)"
            sleep 2
          done
          
          if [ "$DOCKER_OK" = false ]; then
            echo "=== LOGS DO DOCKERD ==="
            cat /tmp/dockerd.log
            exit 1
          fi
          
          # Tenta mudar permissão do socket se necessário
          sudo chmod 666 /var/run/docker.sock || true
          
          # Verifica conexão final
          docker ps

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy no servidor
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Envia "actor:token" ao servidor. A chave é travada (command=),
          # então o servidor usa esse token efêmero só para puxar a imagem do GHCR.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" \
            "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
 